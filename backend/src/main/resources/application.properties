spring.application.name=urban-hair-api
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/urbanhair;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
urbanhair.storage.local-directory=${IMAGE_STORAGE_PATH:./data/images}
urbanhair.storage.provider=${IMAGE_STORAGE_PROVIDER:local}
urbanhair.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
