spring.application.name=urban-hair-api
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/urbanhair;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
urbanhair.storage.local-directory=${IMAGE_STORAGE_PATH:./data/images}
urbanhair.storage.provider=${IMAGE_STORAGE_PROVIDER:local}
urbanhair.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
urbanhair.checkout.stripe-secret-key=${STRIPE_SECRET_KEY:}
urbanhair.checkout.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET:}
urbanhair.checkout.live-payments-enabled=${STRIPE_LIVE_PAYMENTS_ENABLED:false}
urbanhair.checkout.mail-from=${MAIL_FROM:no-reply@urbanhair.fr}
urbanhair.checkout.mail-host=${MAIL_HOST:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
